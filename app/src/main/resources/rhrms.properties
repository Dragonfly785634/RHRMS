# ---------------------------------------------------------------------------
# RHRMS settings for THIS computer. Copy this next to the jar and edit it, or
# point at it with -Drhrms.config=/path/to/rhrms.properties
#
# Anything the rescue might change its mind about (fees, lead times, thresholds)
# is NOT here: it lives in the database's setting table, and the director edits
# it from the Admin screen. This file is only about where things are.
#
# Every value can be overridden by an environment variable: the key upper-cased
# with dots as underscores and RHRMS_ in front, so api.port -> RHRMS_API_PORT.
# ---------------------------------------------------------------------------

db.host = localhost
db.port = 5432
db.name = rhrms

# One PostgreSQL login role per application role. The server picks the pool that
# matches whoever is logged in, so PostgreSQL refuses what the API would refuse.
# Privileges are granted in sql/05_db_roles.sql; the chart is in
# docs/ROLES_AND_PASSWORDS.md.
#
# THESE ARE DEVELOPMENT PASSWORDS. Change all five for a real install, and keep
# this file readable only by the account that runs the server.
db.auth.user           = rhrms_auth
db.auth.password       = auth_dev_pw
db.volunteer.user      = rhrms_volunteer
db.volunteer.password  = volunteer_dev_pw
db.staff.user          = rhrms_staff
db.staff.password      = staff_dev_pw
db.director.user       = rhrms_director
db.director.password   = director_dev_pw

# Connections per pool. A front desk with three or four terminals needs very few.
db.pool.size = 4

# The local API. 127.0.0.1 means only this computer can reach it, which is what
# makes plain HTTP acceptable. Do not change it to 0.0.0.0 without adding TLS.
api.host    = 127.0.0.1
api.port    = 8642
api.threads = 16
